version: '3.8'

services:
  db:
    image: postgres:15
    container_name: scout_postgres
    restart: always
    environment:
      POSTGRES_USER: scout_admin
      POSTGRES_PASSWORD: scout_password_123
      POSTGRES_DB: scoutdb
    ports:
      - "5432:5432"
    volumes:
      - scout_db_data:/var/lib/postgresql/data

volumes:
  scout_db_data: